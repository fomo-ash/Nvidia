name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: fixproof_test
          POSTGRES_USER: fixproof
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixproof -d fixproof_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install '.[dev]'
      - run: ruff check app tests scripts alembic
      - run: ruff format --check app tests scripts alembic
      - run: ruff check ../../scripts
      - run: ruff format --check ../../scripts
      - run: pytest -q
      - name: PostgreSQL invariants and concurrent decisions
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fixproof:test-only@localhost:5432/fixproof_test
      - run: python scripts/export_openapi.py --check
      - run: alembic upgrade head --sql > /dev/null
        env:
          DATABASE_URL: postgresql+psycopg://fixproof:test-only@localhost:5432/fixproof_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai, mcp]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      NEBIUS_API_KEY: mock-nebius-key
      TYPESAFE_API_KEY: mock-typesafe-key
      JEV_API_KEY: mock-jev-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.9.17
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests
      - run: uv run --frozen --extra dev ruff format --check app tests
      - run: uv run --frozen --extra dev pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.checks.yaml config --quiet
      - run: docker compose -f compose.checks.yaml run --build --rm api-checks
      - run: docker compose -f compose.checks.yaml run --build --rm web-checks
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose run --rm api python -m app.seed
      - run: python scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
