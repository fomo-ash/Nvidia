name: fixproof
services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixproof}
      POSTGRES_USER: ${POSTGRES_USER:-fixproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [fixproof]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: { context: ./apps/api, target: runtime }
    environment:
      OPERATOR_SECRET: ${OPERATOR_SECRET:-}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-}
      SAMPLE_TARGET_UID: ${SAMPLE_TARGET_UID:-}
      SAMPLE_CLUSTER_ID: ${SAMPLE_CLUSTER_ID:-local-kind}
      PROPOSAL_TTL_SECONDS: ${PROPOSAL_TTL_SECONDS:-900}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      MCP_SERVER_URL: http://mcp:8002
      AI_SERVICE_URL: http://ai:8001
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      LLM_PROVIDER: mock
      LOCAL_DEMO_ENABLED: ${LOCAL_DEMO_ENABLED:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ALLOWED_ROLE_IDS: '${DISCORD_ALLOWED_ROLE_IDS:-[]}'
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fixproof:change-me-local-only@db:5432/fixproof}
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:5173:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [fixproof]
    restart: unless-stopped
  discord:
    build: { context: ./apps/api, target: runtime }
    command: [python, -m, app.discord_worker]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fixproof:change-me-local-only@db:5432/fixproof}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on: { db: { condition: service_healthy }, api: { condition: service_healthy } }
    networks: [fixproof]
    restart: unless-stopped
  mcp:
    build: { context: ./apps/mcp, target: runtime }
    environment:
      HOST: "0.0.0.0"
      PORT: 8002
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      PROMETHEUS_URL: "http://prometheus:9090"
      KUBERNETES_NAMESPACE: "fixproof-demo"
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  ai:
    build: { context: ./apps/ai, target: runtime }
    environment:
      HOST: "0.0.0.0"
      PORT: 8001
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      LLM_PROVIDER: ${AI_LLM_PROVIDER:-nebius}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-mock-nebius-key}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-mock-typesafe-key}
      JEV_API_KEY: ${JEV_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-45}
      ANALYSIS_MAX_COMPLETION_TOKENS: ${ANALYSIS_MAX_COMPLETION_TOKENS:-8192}
      SYSTEM1_PROVIDER: ${SYSTEM1_PROVIDER:-policy}
      LAYA_ENABLED: ${LAYA_ENABLED:-false}
      LAYA_BASE_URL: ${LAYA_BASE_URL:-http://laya:8000}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      MCP_SERVER_URL: "http://mcp:8002"
      API_BASE_URL: "http://api:8000"
    depends_on: { db: { condition: service_healthy }, mcp: { condition: service_healthy } }
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [fixproof]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    networks: [fixproof]
    restart: unless-stopped
  laya:
    build: { context: ./infra/laya }
    # Deterministic /v1/systemone compatibility service, not the Laya model runtime.
    ports: ["127.0.0.1:8003:8000"]
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
networks:
  fixproof: { driver: bridge }
volumes:
  postgres_data:
