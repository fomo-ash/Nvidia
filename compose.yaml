name: fixproof
services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixproof}
      POSTGRES_USER: ${POSTGRES_USER:-fixproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [fixproof]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: { context: ./apps/api, target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fixproof:change-me-local-only@db:5432/fixproof}
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:5173:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [fixproof]
    restart: unless-stopped
  mcp:
    build: { context: ./apps/mcp, target: runtime }
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: 8002
      PROMETHEUS_URL: "http://prometheus:9090"
      KUBERNETES_NAMESPACE: "fixproof-demo"
      CAPABILITY_SECRET: ${CAPABILITY_SECRET:-fixproof-local-capability-secret-key}
    ports: ["127.0.0.1:8002:8002"]
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  ai:
    build: { context: ./apps/ai, target: runtime }
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: 8001
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-mock-nebius-key}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.studio.nebius.ai/v1}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-mock-typesafe-key}
      JEV_API_KEY: ${JEV_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql+asyncpg://fixproof:change-me-local-only@db:5432/fixproof}
      MCP_SERVER_URL: "http://mcp:8002"
      API_BASE_URL: "http://api:8000"
    depends_on: { db: { condition: service_healthy }, mcp: { condition: service_healthy } }
    ports: ["127.0.0.1:8001:8001"]
    networks: [fixproof]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [fixproof]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    networks: [fixproof]
    restart: unless-stopped
networks:
  fixproof: { driver: bridge }
volumes:
  postgres_data:
