name: fixproof-checks
services:
  api-checks:
    profiles: [checks]
    image: fixproof-api-checks:local
    build: { context: ./apps/api, target: development }
    environment:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      LLM_PROVIDER: mock
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
  api-postgres-checks:
    extends: { service: api-checks }
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://fixproof:test-only@db-checks:5432/fixproof_test
    depends_on: { db-checks: { condition: service_healthy } }
  db-checks:
    profiles: [checks]
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: fixproof_test
      POSTGRES_USER: fixproof
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixproof -d fixproof_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  web-checks:
    profiles: [checks]
    build: { context: ., dockerfile: apps/web/Dockerfile, target: development }
    command: ["pnpm", "test", "--run"]
