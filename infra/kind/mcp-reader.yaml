apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixproof-reader
  namespace: fixproof-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fixproof-reader
  namespace: fixproof-demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [sample-api]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fixproof-reader
  namespace: fixproof-demo
subjects:
  - kind: ServiceAccount
    name: fixproof-reader
    namespace: fixproof-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fixproof-reader
