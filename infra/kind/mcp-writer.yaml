apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixproof-writer
  namespace: fixproof-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fixproof-writer
  namespace: fixproof-demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [sample-api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fixproof-writer
  namespace: fixproof-demo
subjects:
  - kind: ServiceAccount
    name: fixproof-writer
    namespace: fixproof-demo
roleRef:
  kind: Role
  name: fixproof-writer
  apiGroup: rbac.authorization.k8s.io
